name: Build KDBA Android APK + Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build offline APK (debug-signed)
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Copy Android APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KDBA-3D-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KDBA-Android-APK
          path: KDBA-3D-Android.apk
          if-no-files-found: error

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron builder dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: KDBA-Windows-EXE
          path: release/*.exe
          if-no-files-found: error
